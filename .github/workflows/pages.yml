name: Build and deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build dataset
        run: python3 tools/build_seed.py
      - name: Validate data integrity
        run: python3 tools/validate.py
      - name: Build occupation database
        run: python3 tools/build_occupations.py
      - name: Build site
        run: python3 tools/build_pages.py
      - name: Build OG image (non-fatal)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk || true
          python3 -m pip install --quiet Pillow || true
          python3 tools/build_og.py || echo "OG image generation skipped"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
